name: Waflo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: waflo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: waflo
          POSTGRES_USER: waflo
          POSTGRES_PASSWORD: waflo_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waflo -d waflo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.27.9
        ports:
          - 1025:1025
          - 8025:8025

    env:
      CI: true
      NODE_ENV: test
      API_PORT: 4000
      DATABASE_URL: postgresql://waflo:waflo_dev_password@127.0.0.1:5432/waflo?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: false
      EMAIL_FROM: Waflo CI <ci@waflo.local>
      MARKETING_WEB_URL: http://localhost:3000
      MERCHANT_DASHBOARD_URL: http://localhost:3001
      CUSTOMER_WEB_URL: http://localhost:3002
      API_PUBLIC_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      COOKIE_SECURE: false
      COOKIE_NAME: waflo_session
      MERCHANT_BASE_DOMAIN: waflo.app
      LEGAL_TERMS_VERSION: ci-draft
      LEGAL_PRIVACY_VERSION: ci-draft
      LEGAL_EFFECTIVE_DATE: CI only

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate test environment and Prisma schema
        run: |
          pnpm env:validate:test
          pnpm db:validate

      - name: Migrate and seed
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Format and lint
        run: |
          pnpm format:check
          pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, integration, HTTP, and concurrency tests
        run: |
          pnpm test:unit
          pnpm test:integration
          pnpm test:http
          pnpm test:concurrency

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser flows
        run: pnpm test:e2e

      - name: Accessibility
        run: pnpm test:a11y

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/handoff-round-1/screenshots/
            artifacts/handoff-round-1/raw-test-output/
            playwright-report/
            test-results/
