name: Waflo CI and Release

on:
  pull_request:
  push:
    branches:
      - main
      - release/production-v1
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.14.1
  PNPM_VERSION: 11.5.2

jobs:
  verify:
    name: Authoritative validation
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: waflo-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: waflo
          POSTGRES_USER: waflo
          POSTGRES_PASSWORD: waflo_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waflo -d waflo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.27.9
        ports:
          - 1025:1025
          - 8025:8025

    env:
      CI: true
      NODE_ENV: test
      API_PORT: 4000
      DATABASE_URL: postgresql://waflo:waflo_dev_password@127.0.0.1:5432/waflo?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: false
      EMAIL_FROM: Waflo CI <ci@waflo.local>
      MARKETING_WEB_URL: http://localhost:3000
      MERCHANT_DASHBOARD_URL: http://localhost:3001
      CUSTOMER_WEB_URL: http://localhost:3002
      API_PUBLIC_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      COOKIE_SECURE: false
      COOKIE_NAME: waflo_session
      MERCHANT_BASE_DOMAIN: waflo.app
      LEGAL_TERMS_VERSION: ci-draft
      LEGAL_PRIVACY_VERSION: ci-draft
      LEGAL_EFFECTIVE_DATE: CI only
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: waflo-wallet-ci-test
      OBJECT_STORAGE_ACCESS_KEY_ID: waflo_ci_test
      OBJECT_STORAGE_SECRET_ACCESS_KEY: waflo_ci_test_password
      OBJECT_STORAGE_FORCE_PATH_STYLE: true
      OBJECT_STORAGE_ALLOW_INSECURE_INTERNAL: false

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore safe Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Start and initialize Wallet test object storage
        run: |
          docker run --detach \
            --name waflo-ci-wallet-storage \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="${OBJECT_STORAGE_ACCESS_KEY_ID}" \
            --env MINIO_ROOT_PASSWORD="${OBJECT_STORAGE_SECRET_ACCESS_KEY}" \
            --health-cmd "curl --fail http://localhost:9000/minio/health/live" \
            --health-interval 2s \
            --health-timeout 2s \
            --health-retries 30 \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data --address ":9000"

          for attempt in {1..30}; do
            storage_status="$(
              docker inspect --format '{{.State.Health.Status}}' waflo-ci-wallet-storage
            )"
            if [[ "${storage_status}" == "healthy" ]]; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              docker logs waflo-ci-wallet-storage
              exit 1
            fi
            sleep 1
          done

          docker run --rm --network host \
            --env CI_STORAGE_ENDPOINT="${OBJECT_STORAGE_ENDPOINT}" \
            --env CI_STORAGE_ACCESS_KEY="${OBJECT_STORAGE_ACCESS_KEY_ID}" \
            --env CI_STORAGE_SECRET_KEY="${OBJECT_STORAGE_SECRET_ACCESS_KEY}" \
            --env CI_STORAGE_BUCKET="${OBJECT_STORAGE_BUCKET}" \
            --entrypoint /bin/sh \
            minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
            -c '
              mc alias set ci "$CI_STORAGE_ENDPOINT" "$CI_STORAGE_ACCESS_KEY" "$CI_STORAGE_SECRET_KEY" &&
              mc mb --ignore-existing "ci/$CI_STORAGE_BUCKET" &&
              mc anonymous set none "ci/$CI_STORAGE_BUCKET" &&
              mc stat "ci/$CI_STORAGE_BUCKET"
            '

      - name: Static release safety
        run: |
          git diff --check
          git show --check --format= HEAD
          node scripts/w3-secret-scan.mjs RELEASE
          pnpm m2:contracts:verify

      - name: Production dependency audit policy
        run: pnpm audit:production

      - name: Validate test environment and Prisma schema
        run: |
          pnpm env:validate:test
          pnpm db:validate

      - name: Build database seed dependency graph
        run: pnpm --filter "@waflo/database..." build

      - name: Apply all migrations and seed
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Format and lint
        run: |
          pnpm format:check
          pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, integration, HTTP, concurrency, and failure tests
        run: pnpm test

      - name: Production build
        env:
          # Browser flows serve the optimized build against the loopback CI API.
          # Release images are rebuilt in a separate job without this local-only switch.
          WAFLO_LOCAL_PRODUCTION_SMOKE: "1"
        run: pnpm build

      - name: Deployment assertions
        run: pnpm deploy:validate

      - name: Cloudflare token permission regression
        run: sudo bash tests/deployment/cloudflare-token-permissions.test.sh

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - id: browser
        name: Browser flows
        run: pnpm test:e2e

      - id: accessibility
        name: Accessibility
        run: pnpm test:a11y

      - name: Upload failed browser diagnostics only
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            playwright-report/
            test-results/
            !test-results/evidence/**

  publish_release_images:
    name: Publish immutable GHCR images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/production-v1' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: waflo-release-image-publish
      cancel-in-progress: true
    steps:
      - name: Check out the approved release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: coordinates
        name: Resolve lowercase GHCR namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          registry="ghcr.io/${REPOSITORY_OWNER,,}"
          echo "registry=${registry}" >>"${GITHUB_OUTPUT}"

      - name: Publish staging release images
        env:
          IMAGE_REGISTRY: ${{ steps.coordinates.outputs.registry }}
          RELEASE_SHA: ${{ github.sha }}
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_PLATFORM: ${{ vars.RELEASE_IMAGE_PLATFORM || 'linux/amd64' }}
          MAPBOX_STAGING_PUBLIC_TOKEN: ${{ secrets.MAPBOX_STAGING_PUBLIC_TOKEN }}
          RELEASE_IMAGE_SCOPE: staging
        run: deploy/vps/scripts/publish-images.sh

  deploy_staging:
    name: Deploy staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/production-v1' }}
    needs: publish_release_images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://app-staging.waflo.app
    concurrency:
      group: waflo-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Check out the deployed release descriptor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy through the dedicated SSH identity
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: deploy/vps/scripts/deploy-from-github.sh staging "${GITHUB_SHA}"

  deploy_production:
    name: Promote approved images to production
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://app.waflo.app
    concurrency:
      group: waflo-deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify deliberate tag and release-branch ancestry
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin release/production-v1
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/release/production-v1

      - name: Configure Docker Buildx for manifest verification
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate GHCR read-only with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: coordinates
        name: Resolve lowercase GHCR namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          registry="ghcr.io/${REPOSITORY_OWNER,,}"
          echo "registry=${registry}" >>"${GITHUB_OUTPUT}"

      - name: Publish protected production release images
        env:
          IMAGE_REGISTRY: ${{ steps.coordinates.outputs.registry }}
          RELEASE_SHA: ${{ github.sha }}
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_PLATFORM: ${{ vars.RELEASE_IMAGE_PLATFORM || 'linux/amd64' }}
          MAPBOX_PRODUCTION_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PRODUCTION_PUBLIC_TOKEN }}
          RELEASE_IMAGE_SCOPE: production
        run: deploy/vps/scripts/publish-images.sh

      - name: Verify the exact production image set already exists
        env:
          IMAGE_REGISTRY: ${{ steps.coordinates.outputs.registry }}
        run: deploy/vps/scripts/verify-release-images.sh production "${GITHUB_SHA}"

      - name: Deploy through the dedicated SSH identity
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: deploy/vps/scripts/deploy-from-github.sh production "${GITHUB_SHA}"
