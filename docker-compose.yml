name: waflo
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: waflo
      POSTGRES_USER: waflo
      POSTGRES_PASSWORD: waflo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - waflo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waflo -d waflo"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - waflo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  waflo_postgres:
  waflo_redis:

