name: waflo
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: waflo
      POSTGRES_USER: waflo
      POSTGRES_PASSWORD: waflo_dev_password
    ports:
      - "${WAFLO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - waflo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waflo -d waflo"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${WAFLO_REDIS_PORT:-6379}:6379"
    volumes:
      - waflo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27.9
    command:
      [
        "--smtp",
        "0.0.0.0:1025",
        "--listen",
        "0.0.0.0:8025",
        "--smtp-disable-rdns",
      ]
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: waflo_local
      MINIO_ROOT_PASSWORD: waflo_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - waflo_minio:/data
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 waflo_local waflo_local_password; do sleep 1; done &&
        mc mb --ignore-existing local/waflo-private &&
        mc anonymous set none local/waflo-private
    restart: "no"

volumes:
  waflo_postgres:
  waflo_redis:
  waflo_minio:
